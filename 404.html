<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AI Extreme 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0, 102, 255, 0.1) 0%, transparent 60%);
        }
        .error-content { position: relative; z-index: 1; padding: 40px 24px; }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b2b, #ff3c3c, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 0.3em;
            margin: 16px 0 32px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">PAGE NOT FOUND</h1>
            <p style="color:var(--text-secondary);margin-bottom:32px;">The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
        </div>
    </div>
</body>
</html>
